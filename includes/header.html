<!-- Header -->
<header class="app-header">
    <div class="d-flex align-items-center gap-3">
        <!-- Mobile Menu Toggle -->
        <button class="btn btn-link d-lg-none p-0 mobile-menu-toggle" onclick="toggleSidebar()" style="border: none; background: none;">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>

        <h1 class="header-title" id="header-page-title">Cargando...</h1>
    </div>

    <div class="header-actions">
        <!-- Modo Nocturno Toggle -->
        <button id="theme-toggle" class="btn btn-link p-2" style="color: var(--gray-600); border: none; background: none;">
            <!-- Icono de Luna (Por defecto) -->
            <svg id="theme-icon-moon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: block;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
            <!-- Icono de Sol (Oculto por defecto) -->
            <svg id="theme-icon-sun" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: none;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
        </button>

        <!-- User Menu -->
        <div class="user-menu">
            <div class="user-avatar" id="header-user-avatar">
                -
            </div>
            <div class="d-none d-md-block">
                <div style="font-size: 14px; font-weight: 500; color: var(--gray-900);" id="header-user-name">
                    Usuario
                </div>
                <div style="font-size: 12px; color: var(--gray-500);" id="header-user-role">
                    Cargando...
                </div>
            </div>
        </div>
    </div>
</header>
