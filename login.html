<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Camping Sonrisas</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="login-bg">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5 col-lg-4">
                    <div id="alerta" class="alert d-none mb-4 shadow-sm border-0" role="alert"></div>

                    <div class="glass-card">
                        <div class="auth-header text-center">
                            <h3 class="mb-0">Iniciar Sesión</h3>
                            <p class="text-muted small mt-2 mb-0">Bienvenido a Camping Sonrisas Compartidas</p>
                        </div>
                        <div class="card-body auth-body">
                            <form id="formulario-login">
                                <div class="modern-input-group">
                                    <label for="usuario">Usuario</label>
                                    <input type="text" class="form-control form-control-lg" id="usuario" name="usuario"
                                        placeholder="ej. admin" required autocomplete="username">
                                </div>
                                <div class="modern-input-group">
                                    <label for="contraseña">Contraseña</label>
                                    <div class="position-relative">
                                        <input type="password" class="form-control form-control-lg pe-5" id="contraseña"
                                            name="contraseña" placeholder="••••••••" required
                                            autocomplete="current-password">
                                        <button type="button"
                                            class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent text-muted me-2"
                                            id="togglePassword" tabindex="-1" aria-label="Mostrar contraseña">
                                            <!-- SVG Eye Open -->
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16" id="icon-eye">
                                                <path
                                                    d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z" />
                                                <path
                                                    d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z" />
                                            </svg>
                                            <!-- SVG Eye Slash (Hidden by default) -->
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                fill="currentColor" class="bi bi-eye-slash d-none" viewBox="0 0 16 16"
                                                id="icon-eye-slash">
                                                <path
                                                    d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z" />
                                                <path
                                                    d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829z" />
                                                <path
                                                    d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7.029 7.029 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12-.708.708z" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-premium mt-3 w-100 position-relative">
                                    <span class="spinner-border spinner-border-sm d-none me-2" id="btn-spinner"
                                        role="status" aria-hidden="true"></span>
                                    <span id="btn-text">Ingresar al Sistema</span>
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="text-center mt-4 text-white opacity-75 small">
                        &copy; 2025 DEV-Ramirez Jonatan
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
